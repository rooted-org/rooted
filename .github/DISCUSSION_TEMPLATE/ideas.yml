title: '[Idea] '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are for things that aren't settled yet: a feature you'd like, an API that feels wrong, something you'd do differently.
        Once an idea has a clear shape, it can move to an issue.

        Rooted is a one-person hobby project, so not every idea gets built, and it can take a while before anyone replies.
        Ideas with a concrete use case are the easiest to act on.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What you were building, and where rooted got in the way or came up short.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Rough is fine. A code sample of how you'd want to use it helps a lot.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What do you do now instead?
      description: Your current workaround, if you have one, or alternatives you looked at.
